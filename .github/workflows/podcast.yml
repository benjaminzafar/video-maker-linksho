name: Build Persian news podcast
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [make-podcast]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: linksho-editorial-validation
  cancel-in-progress: false

jobs:
  build:
    environment: GEMINI_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies without blocking apt update
        run: |
          python -m pip install -r requirements.txt
          python -c 'import imageio_ffmpeg; print("Bundled FFmpeg ready:", bool(imageio_ffmpeg.get_ffmpeg_exe()))'
      - name: Verify connected API credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          print("Gemini secret configured:", bool(os.getenv("GEMINI_API_KEY")))
          print("ElevenLabs secret configured:", bool(os.getenv("ELEVENLABS_API_KEY")))
          PY
      - name: Generate 8–12 minute Persian video
        env:
          TTS_VOICE: fa-IR-DilaraNeural
          TTS_RATE: -5%
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_SEARCH_GROUNDING: 'false'
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: eleven_v3
          VOICE_PROVIDER: ${{ secrets.ELEVENLABS_API_KEY != '' && 'elevenlabs' || 'edge' }}
        run: python build.py
      - name: Save MP4, audio, sources and text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linksho-weekly-podcast
          path: output/
          retention-days: 7
          if-no-files-found: error
